services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: personal_finance
    ports:
      # Port laptop : port di dalam container. 5432 di laptop sudah dipakai Postgres Homebrew.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d personal_finance"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
